version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, "release:skip"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    ignore:
      # Must match the version webview2-com is built on; updated together with it.
      - dependency-name: windows-core
    groups:
      cargo:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
