version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, "release:skip"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
