[package]
name = "game-shelf"
version = "0.1.0"
edition = "2021"
description = "A desktop widget for Windows that shows your games as book spines on a shelf."
license = "MIT"
repository = "https://github.com/OmerM21/game-shelf-widget"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"
roxmltree = "0.21"
sha2 = "0.11"
dotenvy = "0.15"
tokio = { version = "1", features = ["macros", "sync", "time"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Windows APIs: WebView2 memory settings (main.rs), drive types (xbox.rs),
# and keeping the shelf on the desktop (desktop.rs).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.100"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility"] }
