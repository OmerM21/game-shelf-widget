<!doctype html>
<html lang="en" class="shelf">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Shelf</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <!-- Hovering the top-right corner shows the toolbar. -->
    <div class="corner">
      <div class="toolbar">
        <button id="open-settings" class="icon-button" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"
            />
          </svg>
        </button>
        <!-- Dragging this moves the frameless widget window. -->
        <div class="icon-button drag-handle" data-tauri-drag-region title="Drag to move">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <g fill="currentColor">
              <circle cx="9" cy="6" r="1.6" /><circle cx="15" cy="6" r="1.6" />
              <circle cx="9" cy="12" r="1.6" /><circle cx="15" cy="12" r="1.6" />
              <circle cx="9" cy="18" r="1.6" /><circle cx="15" cy="18" r="1.6" />
            </g>
          </svg>
        </div>
        <!-- Dragging this resizes the widget from its top-right corner. -->
        <div id="resize-handle" class="icon-button resize-handle" title="Drag to resize">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              d="M14 4h6v6 M20 4l-7 7 M10 20H4v-6 M4 20l7-7" />
          </svg>
        </div>
      </div>
    </div>

    <main>
      <div id="shelf" aria-label="Games"></div>
      <p id="status" role="status"></p>
    </main>

    <div id="game-menu" class="menu" role="menu" hidden>
      <button role="menuitem" data-action="launch">Play</button>
      <button role="menuitem" data-action="configure">Configure…</button>
      <button role="menuitem" data-action="hide">Hide from shelf</button>
    </div>
  </body>
</html>
